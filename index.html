<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Screen Countdown Timer</title>
<style>
/* 直接調用你 Timer 資料夾內的 AvenirNext Demi 本地檔案 */
@font-face {
font-family: 'Avenir Next Local';
src: url('AvenirNext.otf') format('opentype'),
url('AvenirNext.ttf') format('truetype'),
local('Avenir Next Demi Bold'),
local('Avenir Next Medium');
font-weight: normal;
font-style: normal;
}

* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

body {
background-color: #000000;
color: #ffffff;
width: 100vw;
height: 100vh;
display: flex;
justify-content: center;
align-items: center;
overflow: hidden;
font-family: 'Avenir Next Local', sans-serif;
-webkit-font-smoothing: antialiased;
}

/* 計時器整體佈局 */
.timer-container {
display: flex;
align-items: flex-start;
justify-content: center;
}

/* 單個數字+英文標籤組 */
.time-group {
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
}

/* 數字設定：拉寬兩位數字之間的距離 */
.time-unit {
font-size: 5cm;
line-height: 0.9;
font-variant-numeric: tabular-nums;
letter-spacing: 0.5em;
}

/* 冒號設定：加大兩側邊距，增加呼吸感 */
.separator {
font-size: 4cm;

line-height: 0.9;
margin: 0 0.3em;
position: relative;
top: -0.06em;
}

/* 下方英文標籤設定：縮短與上方數字的距離 */
.label {
font-size: 0.7cm;
text-transform: uppercase;
letter-spacing: 0.14em;
margin-top: 0.5cm; /* 緊貼數字下方 */
color: #ffffff;
text-align: center;
padding-left: 0.28em;
}
</style>
</head>
<body>

<div class="timer-container">
<div class="time-group">
<span id="months" class="time-unit">00</span>
<span class="label">MONTHS</span>
</div>

<span class="separator">:</span>

<div class="time-group">
<span id="days" class="time-unit">00</span>
<span class="label">DAYS</span>
</div>

<span class="separator">:</span>

<div class="time-group">
<span id="hours" class="time-unit">00</span>
<span class="label">HOURS</span>
</div>

<span class="separator">:</span>

<div class="time-group">
<span id="minutes" class="time-unit">00</span>
<span class="label">MINUTES</span>
</div>

<span class="separator">:</span>

<div class="time-group">
<span id="seconds" class="time-unit">00</span>
<span class="label">SECONDS</span>
</div>
</div>

<script>
// 設定目標時間：香港時間 2026年12月16日 00:00:00
const targetDate = new Date(2026, 11, 16, 0, 0, 0);

function updateTimer() {
const now = new Date();

if (now >= targetDate) {
document.getElementById('months').textContent = "00";
document.getElementById('days').textContent = "00";
document.getElementById('hours').textContent = "00";
document.getElementById('minutes').textContent = "00";
document.getElementById('seconds').textContent = "00";
return;
}

let m = (targetDate.getFullYear() - now.getFullYear()) * 12 + (targetDate.getMonth() - now.getMonth());

let tempDate = new Date(now.getTime());
tempDate.setMonth(tempDate.getMonth() + m);

if (tempDate > targetDate) {
m--;
tempDate = new Date(now.getTime());
tempDate.setMonth(tempDate.getMonth() + m);
}

let diff = targetDate - tempDate;

const second = 1000;
const minute = second * 60;
const hour = minute * 60;
const day = hour * 24;

const d = Math.floor(diff / day);
diff %= day;

const h = Math.floor(diff / hour);
diff %= hour;

const min = Math.floor(diff / minute);
diff %= minute;

const s = Math.floor(diff / second);

document.getElementById('months').textContent = String(m).padStart(2, '0');
document.getElementById('days').textContent = String(d).padStart(2, '0');
document.getElementById('hours').textContent = String(h).padStart(2, '0');
document.getElementById('minutes').textContent = String(min).padStart(2, '0');
document.getElementById('seconds').textContent = String(s).padStart(2, '0');
}

setInterval(updateTimer, 1000);
updateTimer();
</script>
</body>
</html>
